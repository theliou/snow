<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; }
        body {
            background: #000;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: default;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: auto;
            z-index: 1;
        }
        h1{
            position:relative;
            z-index:2;
            color:white;
            text-align:center;
            padding-top:50px;
        }
        /* 隐藏元素预加载雪花字体，强制浏览器提前加载emoji字体 */
        .preload-font{
            position:absolute;
            opacity:0;
            font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
            font-size:20px;
        }
    </style>
</head>
<body>
    <div class="preload-font">❆</div>
    <h1>鼠标靠近雪花会躲开</h1>

    <script>
        (function() {
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            document.body.appendChild(canvas);
            const ctx = canvas.getContext('2d');

            let snowflakes = [];
            const SNOW_COUNT = 150;
            const AVOID_RADIUS = 150;
            const AVOID_FORCE = 1;

            let mouseX = null, mouseY = null;

            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                mouseX = (e.clientX - rect.left) * scaleX;
                mouseY = (e.clientY - rect.top) * scaleY;
            });
            canvas.addEventListener('mouseleave', () => {
                mouseX = null;
                mouseY = null;
            });

            class Snowflake {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 12 + 6;
                    this.speedY = Math.random() * 1.2 + 0.4;
                    this.speedX = Math.random() * 0.6 - 0.3;
                    this.opacity = Math.random() * 0.7 + 0.3;
                }
                update() {
                    this.y += this.speedY;
                    this.x += this.speedX;

                    if (mouseX !== null && mouseY !== null) {
                        const dx = this.x - mouseX;
                        const dy = this.y - mouseY;
                        const distance = Math.hypot(dx, dy);
                        if (distance < AVOID_RADIUS) {
                            const angle = Math.atan2(dy, dx);
                            const forceX = Math.cos(angle) * AVOID_FORCE;
                            const forceY = Math.sin(angle) * AVOID_FORCE;
                            this.x += forceX;
                            this.y += forceY;
                        }
                    }

                    if (this.y > canvas.height + this.size) {
                        this.y = -this.size;
                        this.x = Math.random() * canvas.width;
                    }
                    if (this.x > canvas.width + this.size) {
                        this.x = -this.size;
                        this.y = Math.random() * canvas.height;
                    }
                    if (this.x < -this.size) {
                        this.x = canvas.width + this.size;
                        this.y = Math.random() * canvas.height;
                    }
                }
                draw() {
                    ctx.font = `${this.size}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("❆", this.x, this.y);
                }
            }

            function initSnow() {
                snowflakes = [];
                for (let i = 0; i < SNOW_COUNT; i++) {
                    snowflakes.push(new Snowflake());
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let flake of snowflakes) {
                    flake.update();
                    flake.draw();
                }
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                initSnow();
            });

            // 等待页面所有字体加载完毕，再启动雪花动画，解决首次加载雪花丢失
            document.fonts.ready.then(()=>{
                initSnow();
                animate();
            });
        })();
    </script>
</body>
</html>
